name: Clinic App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build application
      run: npm run build
      
    - name: Success message
      run: |
        echo "✅ Clinic App CI check passed!"
        echo "📱 App: $(node -p "require('./package.json').name")"
        echo "🚀 Expo: $(node -p "require('./package.json').dependencies.expo")"
